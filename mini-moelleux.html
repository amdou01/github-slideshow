<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F2A44">
<meta name="description" content="Checklists interactives de recettes — moelleux, crêpes, flan.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recettes">
<title>Recettes · Checklists interactives</title>

<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,0..100&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bone:#F4ECDB;
    --paper:#FAF4E6;
    --indigo:#1F2A44;
    --indigo-deep:#141B2D;
    --terra:#C75B3F;
    --ochre:#D4A04C;
    --ochre-dark:#9C6F1E;
    --moss:#5C7361;
    --ink:#1B1410;
    --soft:#5E5040;
    --line:#D9C9AE;
    --line-soft:#E8DCC1;
    --warm-bg:#FFF8EC;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    background:var(--bone);
    color:var(--ink);
    font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,sans-serif;
    font-weight:500;
    line-height:1.55;
    font-size:15.5px;
    -webkit-font-smoothing:antialiased;
    padding:0 16px;
    padding-top:calc(56px + var(--safe-top));
    padding-bottom:calc(96px + var(--safe-bottom));
    min-height:100vh;
    overscroll-behavior-y:contain;
  }

  /* TOP BAR ─────────────────────────────────────────────────── */
  .topbar{
    position:fixed;top:0;left:0;right:0;
    background:rgba(250,244,230,.92);
    backdrop-filter:saturate(180%) blur(8px);
    -webkit-backdrop-filter:saturate(180%) blur(8px);
    border-bottom:1px solid var(--ink);
    padding:10px 16px;
    padding-top:calc(10px + var(--safe-top));
    z-index:50;
  }
  .topbar .row{
    display:flex;align-items:center;gap:10px;
    max-width:860px;margin:0 auto 6px;
  }
  .back-btn{
    background:transparent;border:none;cursor:pointer;
    color:var(--terra);font-family:'JetBrains Mono',monospace;
    font-size:11px;font-weight:700;letter-spacing:1px;
    text-transform:uppercase;
    display:inline-flex;align-items:center;gap:4px;
    padding:6px 8px;margin:-6px 0 -6px -8px;
    border-radius:3px;min-height:36px;
  }
  .back-btn:hover,.back-btn:focus-visible{background:var(--bone);outline:none}
  .topbar .title{
    font-family:'Fraunces',serif;font-style:italic;font-size:13px;
    color:var(--indigo);flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .topbar .pct{
    font-family:'JetBrains Mono',monospace;font-size:12px;
    font-weight:700;color:var(--terra);letter-spacing:.5px;
  }
  .progress-track{
    height:4px;background:var(--line-soft);border-radius:2px;
    overflow:hidden;max-width:860px;margin:0 auto;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--terra),var(--ochre),var(--moss));
    width:0%;transition:width .3s ease;
  }
  .topbar.no-progress .progress-track{display:none}

  /* APP CONTAINER ───────────────────────────────────────────── */
  .page{
    max-width:860px;margin:0 auto;
    background:var(--paper);
    border:1px solid var(--ink);border-radius:4px;overflow:hidden;
  }

  /* HOME SCREEN ─────────────────────────────────────────────── */
  .home-head{padding:32px 36px 26px;border-bottom:2px solid var(--ink);position:relative}
  .home-head::before{
    content:"";position:absolute;top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg,var(--terra) 0%,var(--ochre) 50%,var(--moss) 100%);
  }
  .home-head .kicker{
    font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:2px;text-transform:uppercase;
    color:var(--terra);font-weight:700;margin-bottom:14px;
  }
  .home-head h1{
    font-family:'Fraunces',serif;font-weight:400;
    font-variation-settings:"opsz" 144,"SOFT" 30;
    font-size:clamp(36px,6vw,54px);line-height:1;
    color:var(--indigo);letter-spacing:-1.5px;margin-bottom:8px;
  }
  .home-head h1 em{font-style:italic;color:var(--terra);font-weight:500}
  .home-head .lead{
    color:var(--soft);font-family:'Fraunces',serif;
    font-style:italic;font-size:17px;font-weight:300;max-width:560px;
  }

  .recipes{padding:28px 36px 36px;display:grid;gap:16px}
  @media(min-width:680px){.recipes{grid-template-columns:repeat(2,1fr)}}

  .r-card{
    background:var(--paper);
    border:1.5px solid var(--ink);
    border-radius:4px;
    padding:22px 22px 18px;
    text-decoration:none;color:inherit;
    display:flex;flex-direction:column;
    transition:transform .15s ease,box-shadow .15s ease;
    position:relative;overflow:hidden;
    min-height:220px;
  }
  .r-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:var(--accent,var(--terra));
  }
  .r-card:hover,.r-card:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 6px 20px rgba(0,0,0,.08);
    outline:none;
  }
  .r-card .topline{
    display:flex;align-items:flex-start;justify-content:space-between;
    margin-bottom:14px;gap:12px;
  }
  .r-card .emoji{font-size:38px;line-height:1}
  .r-card .badge-pct{
    font-family:'JetBrains Mono',monospace;
    background:var(--bone);border:1px solid var(--line);
    padding:4px 10px;border-radius:50px;
    font-size:10px;font-weight:700;letter-spacing:1px;
    color:var(--soft);
  }
  .r-card .badge-pct.active{background:var(--moss);color:white;border-color:var(--moss)}
  .r-card h3{
    font-family:'Fraunces',serif;font-weight:500;
    font-size:24px;line-height:1.1;color:var(--indigo);
    margin-bottom:4px;
  }
  .r-card .em{font-style:italic;color:var(--terra);font-weight:400;font-size:18px;display:block}
  .r-card .stats{
    display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;
    padding-top:14px;border-top:1px dashed var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:1px;text-transform:uppercase;
    color:var(--soft);font-weight:700;
  }
  .r-card .ref{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--soft);font-weight:600;margin-top:auto;padding-top:14px;
  }
  .r-card .mini-track{
    height:3px;background:var(--line-soft);border-radius:2px;
    overflow:hidden;margin-top:10px;
  }
  .r-card .mini-fill{
    height:100%;background:var(--accent,var(--terra));
    transition:width .3s ease;
  }

  /* RECIPE HEADER ──────────────────────────────────────────── */
  .head{padding:32px 36px 26px;border-bottom:2px solid var(--ink);background:var(--paper);position:relative}
  .head::before{
    content:"";position:absolute;top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg,var(--terra) 0%,var(--ochre) 50%,var(--moss) 100%);
  }
  .top-row{
    display:flex;justify-content:space-between;align-items:center;
    font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:2px;text-transform:uppercase;
    color:var(--terra);font-weight:700;margin-bottom:18px;
  }
  .top-row .ref{color:var(--soft)}
  h1.recipe-title{
    font-family:'Fraunces',serif;font-weight:400;
    font-variation-settings:"opsz" 144,"SOFT" 30;
    font-size:clamp(32px,5vw,48px);line-height:1;
    color:var(--indigo);letter-spacing:-1.2px;margin-bottom:6px;
  }
  h1.recipe-title em{font-style:italic;color:var(--terra);font-weight:500}
  .subtitle{
    color:var(--soft);font-family:'Fraunces',serif;
    font-style:italic;font-size:16px;font-weight:300;
  }
  .meta-row{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;
    margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
  }
  .meta b{
    display:block;font-family:'JetBrains Mono',monospace;
    font-size:9px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--soft);font-weight:700;margin-bottom:4px;
  }
  .meta span{
    font-family:'Fraunces',serif;font-size:18px;font-weight:500;color:var(--indigo);
  }

  /* TIMELINE ────────────────────────────────────────────────── */
  .timeline{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
  .timeline-title{
    font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:2.5px;text-transform:uppercase;
    color:var(--terra);font-weight:700;margin-bottom:14px;
  }
  .phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
  .phase{
    background:var(--bone);border:1px solid var(--line);
    border-left:3px solid var(--terra);
    border-radius:2px;padding:10px 12px;
    text-decoration:none;color:inherit;transition:transform .15s ease;
    text-align:left;cursor:pointer;font:inherit;
  }
  .phase:active{transform:scale(.98)}
  .phase:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
  .phase.ochre{border-left-color:var(--ochre)}
  .phase.ochre .phase-lab{color:var(--ochre-dark)}
  .phase.indigo{border-left-color:var(--indigo)}
  .phase.indigo .phase-lab{color:var(--indigo)}
  .phase.moss{border-left-color:var(--moss)}
  .phase.moss .phase-lab{color:var(--moss)}
  .phase-lab{
    font-family:'JetBrains Mono',monospace;font-size:9px;
    letter-spacing:1.5px;color:var(--terra);font-weight:700;margin-bottom:3px;
  }
  .phase-name{
    font-family:'Fraunces',serif;font-size:14px;
    color:var(--indigo);font-weight:500;line-height:1.2;
  }
  .phase-steps{font-size:11px;color:var(--soft);margin-top:3px;font-family:'JetBrains Mono',monospace}

  /* SECTION ─────────────────────────────────────────────────── */
  .section{
    padding:28px 36px 24px;border-bottom:1px solid var(--line);
    scroll-margin-top:80px;
  }
  .section:last-of-type{border-bottom:none}
  .section.tip{background:linear-gradient(180deg,var(--warm-bg) 0%,var(--paper) 100%)}
  .section.sos{background:var(--warm-bg);border-top:2px solid var(--terra)}
  .section-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .step-num{
    font-family:'Fraunces',serif;font-style:italic;font-weight:300;
    font-size:38px;color:var(--terra);line-height:1;
    letter-spacing:-2px;min-width:50px;
  }
  .step-num.moss{color:var(--moss)}
  .step-num.warn{color:var(--terra)}
  .section-head h2{
    font-family:'Fraunces',serif;font-weight:500;font-size:22px;
    color:var(--indigo);line-height:1.1;flex:1;
  }
  .time{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--soft);background:var(--bone);border:1px solid var(--line);
    padding:4px 10px;border-radius:2px;font-weight:700;
    letter-spacing:1px;white-space:nowrap;
  }
  .time.moss{background:var(--moss);color:white;border-color:var(--moss)}
  .time.terra{background:var(--terra);color:white;border-color:var(--terra)}
  .section-intro{
    font-family:'Fraunces',serif;font-style:italic;
    color:var(--soft);font-size:15px;margin-bottom:18px;line-height:1.5;
  }

  /* CALLOUTS ────────────────────────────────────────────────── */
  .callout{padding:14px 18px;margin-bottom:18px;border-radius:0 3px 3px 0}
  .callout.tip{background:var(--warm-bg);border-left:3px solid var(--ochre)}
  .callout.warn{background:var(--moss);color:white;padding:14px 18px;border-radius:3px}
  .callout.dark{background:var(--indigo-deep);color:var(--bone);padding:18px 22px;border-radius:3px;border-left:4px solid var(--ochre);margin-top:24px}
  .callout.note{background:#fff;border:1px dashed var(--line);padding:14px 18px;margin-top:14px;border-radius:3px}
  .callout-lab{
    font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:4px;
  }
  .callout.tip .callout-lab{color:var(--ochre-dark)}
  .callout.warn .callout-lab{color:#FFE9C7}
  .callout.dark .callout-lab{color:var(--ochre);margin-bottom:6px}
  .callout.note .callout-lab{color:var(--moss)}
  .callout p{font-size:14px;line-height:1.5;font-style:italic;font-family:'Fraunces',serif}
  .callout.warn p{font-weight:500;font-style:normal;font-family:inherit;font-size:14px}
  .callout.warn b{color:#FFE9C7}
  .callout.dark p{font-style:italic;font-size:15px;line-height:1.5}
  .callout.dark b{font-style:normal;font-weight:700;color:var(--ochre)}
  .callout.note p{font-style:normal;font-family:inherit;color:var(--ink)}

  /* SUB HEADERS ─────────────────────────────────────────────── */
  .sub-head{
    font-family:'JetBrains Mono',monospace;font-size:11px;
    letter-spacing:2.5px;text-transform:uppercase;
    color:var(--terra);font-weight:700;
    margin:24px 0 12px;padding-top:8px;border-top:1px solid var(--line);
  }
  .sub-head:first-of-type{margin-top:0;padding-top:0;border-top:none}
  .sub-head .badge{
    background:var(--moss);color:white;
    padding:2px 8px;border-radius:2px;
    font-size:9px;margin-left:6px;
  }
  .sub-head .badge.ochre{background:var(--ochre);color:var(--indigo-deep)}

  /* CHECKLIST ───────────────────────────────────────────────── */
  .check-list{list-style:none;padding:0}
  .check-list li{
    display:grid;grid-template-columns:auto 1fr auto;gap:14px;
    align-items:flex-start;padding:11px 0;
    border-bottom:1px dashed var(--line-soft);
  }
  .check-list li:last-child{border-bottom:none}
  .cb-wrap{
    display:inline-flex;align-items:flex-start;cursor:pointer;
    min-width:44px;min-height:44px;margin:-11px 0;padding:11px 0;
  }
  .cb{
    display:inline-block;width:22px;height:22px;
    border:2px solid var(--ink);border-radius:3px;
    background:var(--paper);position:relative;flex-shrink:0;
    transition:all .15s ease;margin-top:1px;
  }
  .cb-wrap:hover .cb{border-color:var(--terra)}
  .cb-wrap:focus-visible .cb{outline:2px solid var(--terra);outline-offset:2px}
  input[type="checkbox"]{position:absolute;opacity:0;pointer-events:none}
  input[type="checkbox"]:checked + .cb{background:var(--moss);border-color:var(--moss)}
  input[type="checkbox"]:checked + .cb::after{
    content:"";position:absolute;left:6px;top:2px;
    width:6px;height:11px;border:solid white;
    border-width:0 2.5px 2.5px 0;transform:rotate(42deg);
  }
  .label{line-height:1.45;color:var(--ink);font-weight:500;font-size:15.5px;transition:opacity .2s ease}
  li.done .label{text-decoration:line-through;color:var(--soft);opacity:.6}
  .label .qty{
    font-family:'JetBrains Mono',monospace;font-weight:700;
    color:var(--indigo);font-size:14.5px;
    background:var(--bone);padding:1px 8px;border-radius:3px;
    margin-right:6px;border:1px solid var(--line);
  }
  .label .note{
    display:block;font-family:'Fraunces',serif;font-style:italic;
    font-size:13.5px;color:var(--soft);margin-top:3px;font-weight:400;
  }
  .label .opt{
    display:inline-block;background:var(--ochre);color:var(--indigo-deep);
    font-family:'JetBrains Mono',monospace;
    font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;
    padding:2px 6px;border-radius:2px;margin-left:6px;vertical-align:middle;
  }
  .tag{
    font-family:'JetBrains Mono',monospace;font-size:9px;
    letter-spacing:1.2px;text-transform:uppercase;
    color:var(--soft);font-weight:700;padding-top:5px;white-space:nowrap;
  }

  /* TEMP BLOCK ──────────────────────────────────────────────── */
  .temp-block{
    background:var(--indigo);color:var(--bone);padding:18px 22px;border-radius:3px;
    margin:14px 0 4px;display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:18px;align-items:center;
  }
  .temp-cell .lab{
    font-family:'JetBrains Mono',monospace;font-size:9px;
    letter-spacing:2px;text-transform:uppercase;
    color:var(--ochre);font-weight:700;margin-bottom:3px;
  }
  .temp-cell .val{
    font-family:'Fraunces',serif;font-weight:600;
    font-size:24px;color:var(--bone);line-height:1.1;
  }
  .temp-cell .val .unit{
    font-family:'JetBrains Mono',monospace;font-size:14px;
    font-weight:500;color:var(--ochre);margin-left:2px;
  }

  /* TIMERS ──────────────────────────────────────────────────── */
  .timers{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;margin-top:14px;
  }
  .timer-btn{
    background:var(--paper);border:2px solid var(--indigo);color:var(--indigo);
    padding:12px 14px;border-radius:3px;
    font-family:'JetBrains Mono',monospace;font-weight:700;
    font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    transition:all .15s ease;min-height:48px;
  }
  .timer-btn:hover{background:var(--indigo);color:var(--paper)}
  .timer-btn:focus-visible{outline:2px solid var(--terra);outline-offset:2px}
  .timer-btn.running{background:var(--terra);color:white;border-color:var(--terra);animation:pulse 2s ease-in-out infinite}
  .timer-btn.done{background:var(--moss);color:white;border-color:var(--moss)}
  .timer-btn .label-t{font-size:11px;letter-spacing:1.5px}
  .timer-btn .countdown{font-size:14px;font-variant-numeric:tabular-nums}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(199,91,63,.4)}50%{box-shadow:0 0 0 8px rgba(199,91,63,0)}}

  /* WARNINGS ────────────────────────────────────────────────── */
  .warns{
    background:var(--bone);border-left:3px solid var(--terra);
    padding:18px 22px;margin:0 36px 28px;border-radius:0 3px 3px 0;
  }
  .warns h3{
    font-family:'JetBrains Mono',monospace;font-size:10px;
    letter-spacing:2.5px;text-transform:uppercase;
    color:var(--terra);font-weight:700;margin-bottom:12px;
  }
  .warns ul{list-style:none;padding:0}
  .warns li{padding:6px 0 6px 22px;position:relative;font-size:14px;line-height:1.5}
  .warns li::before{content:"⚠";position:absolute;left:0;top:6px;color:var(--terra);font-weight:700}
  .warns li b{color:var(--indigo);font-weight:700}

  /* QUALITY ─────────────────────────────────────────────────── */
  .quality{
    background:linear-gradient(180deg,var(--paper) 0%,var(--bone) 100%);
    padding:24px 36px;border-top:2px solid var(--ink);
  }
  .quality h2{
    font-family:'Fraunces',serif;font-style:italic;font-size:22px;
    color:var(--indigo);margin-bottom:14px;font-weight:500;
  }
  .quality h2 em{color:var(--terra)}
  .quality-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px;margin-top:12px;
  }
  .q-card{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:14px 16px}
  .q-card .lab{
    font-family:'JetBrains Mono',monospace;font-size:9px;
    letter-spacing:1.5px;text-transform:uppercase;
    color:var(--terra);font-weight:700;margin-bottom:6px;
  }
  .q-card p{font-size:13.5px;color:var(--ink);line-height:1.45}

  /* FOOTER ──────────────────────────────────────────────────── */
  .foot{
    padding:18px 36px;background:var(--indigo-deep);color:var(--bone);
    display:flex;justify-content:space-between;align-items:center;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;
  }
  .foot .ays{color:var(--ochre);font-weight:700}

  /* BOTTOM ACTIONS ──────────────────────────────────────────── */
  .actions{
    position:fixed;bottom:0;left:0;right:0;
    padding:12px 16px;padding-bottom:calc(12px + var(--safe-bottom));
    background:rgba(20,27,45,.95);
    backdrop-filter:saturate(180%) blur(8px);
    -webkit-backdrop-filter:saturate(180%) blur(8px);
    z-index:50;display:flex;gap:8px;justify-content:center;
    border-top:1px solid var(--ink);
  }
  .action-btn{
    background:transparent;color:var(--bone);
    border:1px solid var(--soft);padding:10px 14px;border-radius:50px;

  .action-btn:hover,.action-btn:focus-visible{background:var(--terra);border-color:var(--terra);outline:none}

  .action-btn.primary:hover{background:var(--ochre);border-color:var(--ochre);color:var(--indigo-deep)}

  /* TOAST ───────────────────────────────────────────────────── */
  .toast{
    position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--indigo-deep);color:var(--bone);
    padding:12px 20px;border-radius:50px;font-size:13px;font-weight:600;
    z-index:100;opacity:0;pointer-events:none;
    transition:all .3s ease;box-shadow:0 4px 16px rgba(0,0,0,.3);

  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* RESPONSIVE ──────────────────────────────────────────────── */
  @media(max-width:600px){
    body{font-size:15px}
    .home-head,.head,.section,.warns,.quality,.foot,.recipes{padding-left:18px;padding-right:18px}
    .warns{margin-left:18px;margin-right:18px}
    .step-num{font-size:30px;min-width:38px}
    .section-head h2{font-size:18px}
    .check-list li{grid-template-columns:auto 1fr;gap:10px}
    .tag{display:none}
    .meta-row{grid-template-columns:repeat(2,1fr)}
    .top-row{font-size:9px}
    .action-btn{padding:10px 12px;font-size:11px}
    .recipes{grid-template-columns:1fr}
  }

  /* PWA install button (floating bottom-right, hidden by default) */
  .install-fab{
    position:fixed;right:16px;bottom:16px;z-index:1000;
    display:none;
    padding:12px 16px;
    border:1px solid var(--terra);background:var(--terra);color:var(--paper);

  @supports (padding:max(0px)){
    .install-fab{bottom:max(16px,env(safe-area-inset-bottom));right:max(16px,env(safe-area-inset-right))}
  }

  @media print{
    body{background:white;padding:0}
    .page{border:none;border-radius:0;background:white}
    .topbar,.actions,.toast,.timers,.install-fab{display:none}
    .section,.warns{break-inside:avoid;page-break-inside:avoid}
    .cb{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}

  // ════════════════════════════════════════════════════════════
  //  STATE — per-recipe localStorage
  // ════════════════════════════════════════════════════════════

  const stateKey = id => `recipe-state-v1-${id}`;

  const loadChecked = id => {
    try {
      const raw = localStorage.getItem(stateKey(id));
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? new Set(arr) : new Set();
    } catch (_) { return new Set(); }
  };

  const saveChecked = (id, set) => {
    try { localStorage.setItem(stateKey(id), JSON.stringify([...set])); } catch (_) {}
  };

  const totalItems = recipe => {
    let n = 0;
    for (const sec of recipe.sections) {
      n += sec.items?.length || 0;
      n += (sec.groups || []).reduce((a, g) => a + (g.items?.length || 0), 0);
    }
    return n;
  };

  const recipeProgress = id => {
    const recipe = RECIPES[id];
    if (!recipe) return { done: 0, total: 0, pct: 0 };
    const total = totalItems(recipe);
    const done = loadChecked(id).size;
    return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
  };

  // ════════════════════════════════════════════════════════════
  //  RENDER HELPERS
  //  Recipe data is authored by us (trusted) — text/note may
  //  contain HTML (<b>, etc.).
  // ════════════════════════════════════════════════════════════

  const sectionAnchor = sec => 's-' + (sec.anchor || sec.num.replace(/[^a-z0-9]/gi, ''));

  const renderItem = (item, idx) => `
    <li>
      <label class="cb-wrap">
        <input type="checkbox" data-idx="${idx}" aria-labelledby="lbl-${idx}">
        <span class="cb"></span>
      </label>
      <span class="label" id="lbl-${idx}">
        ${item.qty ? `<span class="qty">${item.qty}</span>` : ''}
        ${item.text}
        ${item.opt ? `<span class="opt">${item.opt}</span>` : ''}
        ${item.note ? `<span class="note">${item.note}</span>` : ''}
      </span>
      ${item.tag ? `<span class="tag">${item.tag}</span>` : ''}
    </li>
  `;

  const renderCallout = c => `
    <div class="callout ${c.variant}">
      ${c.label ? `<div class="callout-lab">${c.label}</div>` : ''}
      <p>${c.text}</p>
    </div>
  `;

  const renderTempBlock = cells => `
    <div class="temp-block">
      ${cells.map(c => `
        <div class="temp-cell">
          <div class="lab">${c.lab}</div>
          <div class="val">${c.val}<span class="unit">${c.unit}</span></div>
        </div>
      `).join('')}
    </div>
  `;

  const fmtTime = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

  const renderTimers = timers => `
    <div class="timers" role="group" aria-label="Minuteurs de cuisson">
      ${timers.map(t => `
        <button class="timer-btn" data-timer="${t.seconds}" type="button" aria-label="Lancer minuteur ${t.label}">
          <span class="label-t">${t.label}</span>
          <span class="countdown">${fmtTime(t.seconds)}</span>
        </button>
      `).join('')}
    </div>
  `;

  // Stateful counter so each rendered checkbox gets a stable index per render
  const renderSection = (sec, counter) => {
    const id = sectionAnchor(sec);
    const heading = `
      <div class="section-head">
        <div class="step-num ${sec.numClass || ''}">${sec.num}</div>
        <h2 id="h-${id}">${sec.title}</h2>
        <span class="time ${sec.timeVariant || ''}">${sec.time}</span>
      </div>
    `;
    const intro = sec.intro ? `<p class="section-intro">${sec.intro}</p>` : '';
    const callout = sec.callout ? renderCallout(sec.callout) : '';
    const tempBlock = sec.tempBlock ? renderTempBlock(sec.tempBlock) : '';
    const timers = sec.timers ? renderTimers(sec.timers) : '';

    let body = '';
    if (sec.items) {
      body += `<ul class="check-list">${sec.items.map(it => renderItem(it, counter.next())).join('')}</ul>`;
    }
    if (sec.groups) {
      body += sec.groups.map(g => `
        <h4 class="sub-head">${g.heading}${g.badge ? `<span class="badge ${g.badge.variant === 'ochre' ? 'ochre' : ''}">${g.badge.text}</span>` : ''}</h4>
        <ul class="check-list">${g.items.map(it => renderItem(it, counter.next())).join('')}</ul>
      `).join('');
    }
    const callouts = (sec.callouts || []).map(renderCallout).join('');

    return `<section class="section ${sec.variant || ''}" id="${id}" aria-labelledby="h-${id}">${heading}${intro}${callout}${tempBlock}${body}${timers}${callouts}</section>`;
  };

  // ════════════════════════════════════════════════════════════

  // ════════════════════════════════════════════════════════════
  //  RECIPE BEHAVIOR — checkboxes, timers, actions
  // ════════════════════════════════════════════════════════════

  const liveTimers = []; // { btn, intervalId, cdEl, total, remaining, running }
  let wakeLock = null;

  const requestWakeLock = async () => {
    if (!('wakeLock' in navigator)) return;
    if (wakeLock) return;
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
  };
  const releaseWakeLock = () => { wakeLock?.release().catch(() => {}); wakeLock = null; };
  const maybeReleaseWakeLock = () => {
    if (!liveTimers.some(t => t.running)) releaseWakeLock();
  };

  const cleanupRecipe = () => {
    liveTimers.forEach(t => { clearInterval(t.intervalId); t.intervalId = null; t.running = false; });
    liveTimers.length = 0;
    releaseWakeLock();
  };

  let toastTimer;
  const showToast = (msg, ms = 2500) => {
    $toast.textContent = msg;
    $toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $toast.classList.remove('show'), ms);
  };

  const bindRecipeBehavior = (id, checked) => {
    const checkboxes = Array.from(document.querySelectorAll('input[type="checkbox"]'));
    const fill = document.getElementById('progressFill');
    const pctText = document.getElementById('pctText');
    const progressBar = document.getElementById('progressBar');

    // Restore state
    checkboxes.forEach(cb => {
      const idx = +cb.dataset.idx;
      if (checked.has(idx)) {
        cb.checked = true;
        cb.closest('li')?.classList.add('done');
      }
    });

    const updateProgress = () => {
      const done = checkboxes.filter(cb => cb.checked).length;
      const pct = checkboxes.length ? Math.round(done / checkboxes.length * 100) : 0;
      fill.style.width = pct + '%';
      pctText.textContent = pct + '%';
      progressBar.setAttribute('aria-valuenow', pct);
      if (pct === 100) showToast('🎉 Recette terminée — bon appétit !');
    };

    checkboxes.forEach(cb => {
      cb.addEventListener('change', () => {
        const idx = +cb.dataset.idx;
        cb.closest('li')?.classList.toggle('done', cb.checked);
        if (cb.checked) checked.add(idx); else checked.delete(idx);
        saveChecked(id, checked);
        updateProgress();
      });
    });

    // Back button
    document.getElementById('backBtn')?.addEventListener('click', () => { location.hash = '#/'; });

    // Reset
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!confirm('Réinitialiser la checklist de cette recette ?')) return;
      checkboxes.forEach(cb => { cb.checked = false; cb.closest('li')?.classList.remove('done'); });
      checked.clear();
      saveChecked(id, checked);
      updateProgress();
      showToast('Checklist réinitialisée');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Print
    document.getElementById('printBtn').addEventListener('click', () => window.print());

    // Next unchecked
    document.getElementById('nextBtn').addEventListener('click', () => {
      const next = checkboxes.find(cb => !cb.checked);
      if (!next) { showToast('Tout est coché !'); return; }
      const li = next.closest('li');
      li?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      li?.animate(
        [{ background: 'rgba(199,91,63,.18)' }, { background: 'transparent' }],
        { duration: 1400, easing: 'ease-out' }
      );
    });

    // Cooking timers
    document.querySelectorAll('.timer-btn').forEach(btn => bindTimer(btn));

    // Phase navigation (in-page scroll without triggering router)
    document.querySelectorAll('.phase').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        target?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });

    updateProgress();
  };

  const bindTimer = btn => {
    const total = +btn.dataset.timer;
    const cdEl = btn.querySelector('.countdown');
    const labelText = btn.querySelector('.label-t').textContent;
    const state = { btn, intervalId: null, cdEl, total, remaining: total, running: false };
    liveTimers.push(state);

    const reset = () => {
      state.remaining = total;
      cdEl.textContent = fmtTime(total);
      btn.classList.remove('running', 'done');
      state.running = false;
    };

    const finish = () => {
      clearInterval(state.intervalId);
      state.intervalId = null;
      btn.classList.remove('running');
      btn.classList.add('done');
      state.running = false;
      maybeReleaseWakeLock();
      cdEl.textContent = 'Fini !';
      try { navigator.vibrate?.([300, 150, 300, 150, 600]); } catch (_) {}
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) {
          const ctx = new Ctx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 880; gain.gain.value = .3;
          osc.start(); osc.stop(ctx.currentTime + .6);
          osc.onended = () => { ctx.close?.().catch(() => {}); };
        }
      } catch (_) {}
      showToast(`⏰ Minuteur "${labelText}" terminé`, 5000);
    };

    btn.addEventListener('click', () => {
      if (btn.classList.contains('done')) { reset(); return; }
      if (state.running) {
        clearInterval(state.intervalId);
        state.intervalId = null;
        btn.classList.remove('running');
        state.running = false;
        maybeReleaseWakeLock();
        return;
      }
      state.running = true;
      btn.classList.add('running');
      requestWakeLock();
      state.intervalId = setInterval(() => {
        state.remaining--;
        if (state.remaining < 0) state.remaining = 0;
        cdEl.textContent = fmtTime(state.remaining);
        if (state.remaining <= 0) finish();
      }, 1000);
    });
  };

  // ════════════════════════════════════════════════════════════
  //  ROUTER — hash-based, #/r/<id> opens a recipe
  // ════════════════════════════════════════════════════════════

  const route = () => {
    cleanupRecipe();
    const m = (location.hash || '').match(/^#\/r\/([a-z0-9_-]+)$/);
    if (m && RECIPES[m[1]]) {
      renderRecipe(m[1]);
    } else {
      renderHome();
    }
    window.scrollTo(0, 0);
  };

  window.addEventListener('hashchange', route);
  route();

  // ════════════════════════════════════════════════════════════
  //  PWA — service worker registration + install prompt
  // ════════════════════════════════════════════════════════════
  const $install = document.getElementById('installBtn');
  let deferredInstall = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstall = e;
    if ($install) $install.classList.add('visible');
  });

  if ($install) {
    $install.addEventListener('click', async () => {
      if (!deferredInstall) return;
      $install.classList.remove('visible');
      try {
        deferredInstall.prompt();
        await deferredInstall.userChoice;
      } catch (_) { /* noop */ }
      deferredInstall = null;
    });
  }

  window.addEventListener('appinstalled', () => {
    deferredInstall = null;
    if ($install) $install.classList.remove('visible');
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
})();
</script>

</body>
</html>
